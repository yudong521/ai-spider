[project]
name = "crawler-agent-backend"
version = "0.1.0"
description = "智能爬虫 Agent 系统后端"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "crawl4ai>=0.7.8",
    "pydantic>=2.0.0",
    "sse-starlette>=2.0.0",
    "python-multipart>=0.0.9",
    "langchain>=1.1.3",
    "langchain-openai>=1.1.2",
    "apscheduler>=3.11.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
